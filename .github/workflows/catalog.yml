# After every push, rebuilds catalog.json (the list of books the CoolRead app reads)
# and telegram/ (the books cut into messages for the Telegram bot), and commits them
# if anything changed. To add a book, just upload the fb2 and its cover.
name: Update catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog.mjs
      - run: node scripts/build-telegram.mjs
      - name: Commit catalog.json and telegram/
        run: |
          git add -A catalog.json telegram
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update catalog.json"
          git push
