# After every push, rebuilds catalog.json (the list of books the CoolRead app reads)
# and commits it if anything changed. To add a book, just upload the fb2 and its cover.
name: Update catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog.mjs
      - name: Commit catalog.json
        run: |
          if git diff --quiet -- catalog.json && git ls-files --error-unmatch catalog.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update catalog.json"
          git push
